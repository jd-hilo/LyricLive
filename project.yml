# XcodeGen project definition. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
#
# Every identifier lives in the "Configure here" block under settings.base. The targets only
# reference those values, so the team, bundle IDs, App Group and product IDs are set in one place.
name: LyricLive

options:
  bundleIdPrefix: com.hilollc
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # ---- Configure here (the only place these values are set) ----------------------------
    # Apple Developer Team ID for Hilo LLC. Same team as Petmoji (com.hilollc.petmoji.app).
    DEVELOPMENT_TEAM: N8SACG5845
    APP_DISPLAY_NAME: LyricLive
    # App: com.hilollc.lyriclive   Widget extension: com.hilollc.lyriclive.widgets
    APP_BUNDLE_ID_BASE: com.hilollc.lyriclive
    # Shared by the app and the widget extension (entitlements and Info.plist LLAppGroup).
    APP_GROUP_ID: group.$(APP_BUNDLE_ID_BASE)   # resolves to group.com.hilollc.lyriclive
    APP_URL_SCHEME: lyriclive
    # Create an app at https://developer.spotify.com/dashboard and paste its Client ID.
    # Redirect URI to register there: lyriclive://spotify-login-callback
    # iOS bundle ID to register there: com.hilollc.lyriclive
    SPOTIFY_CLIENT_ID: YOUR_SPOTIFY_CLIENT_ID
    # StoreKit product IDs: com.hilollc.lyriclive.pro.monthly, .yearly and .lifetime.
    # Keep App/Resources/LyricLive.storekit in sync if you change this.
    PRODUCT_ID_PREFIX: com.hilollc.lyriclive.pro

packages:
  LyricCore:
    path: Packages/LyricCore
  # Optional. Remove this entry and the SpotifyiOS dependency below to build without Spotify support;
  # the code is guarded by #if canImport(SpotifyiOS).
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    from: 5.0.1

targets:
  LyricLive:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.storekit"
          - "**/PrivacyInfo.xcprivacy"
      - path: Shared
      - path: App/Resources/LyricLive.storekit
        buildPhase: none
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: LyricLiveWidgets
        embed: true
      - package: LyricCore
      - package: SpotifyiOS
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hant]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        # English is the development language. zh-Hant is optional and is not the assumed audience.
        NSAppleMusicUsageDescription: Lyrics need to know which song is playing in the Music app.
        NSMicrophoneUsageDescription: Shazam mode listens for music playing around you to identify the song. Audio is only used to find a match.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [audio]
        LSApplicationQueriesSchemes: [spotify]
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID_BASE)
            CFBundleURLSchemes: [$(APP_URL_SCHEME)]
        LLAppGroup: $(APP_GROUP_ID)
        LLURLScheme: $(APP_URL_SCHEME)
        LLSpotifyClientID: $(SPOTIFY_CLIENT_ID)
        LLProductPrefix: $(PRODUCT_ID_PREFIX)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID_BASE)
        PRODUCT_NAME: LyricLive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Swap for Config/App-CarPlay.entitlements once Apple grants the CarPlay entitlement (see README).
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES

  LyricLiveWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "**/PrivacyInfo.xcprivacy"
      - path: Shared
      - path: Widgets/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LyricCore
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hant]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LLAppGroup: $(APP_GROUP_ID)
        LLURLScheme: $(APP_URL_SCHEME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID_BASE).widgets
        CODE_SIGN_ENTITLEMENTS: Config/Widgets.entitlements
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  LyricLive:
    build:
      targets:
        LyricLive: all
        LyricLiveWidgets: all
    run:
      config: Debug
      storeKitConfiguration: App/Resources/LyricLive.storekit
    archive:
      config: Release
